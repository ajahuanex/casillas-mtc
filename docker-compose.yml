services:
  # Base de Datos Relacional: PostgreSQL con soporte JSONB para respuestas MTC
  postgres:
    image: postgres:16-alpine
    container_name: casillas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-casillas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casillas_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-casillas_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casillas_user} -d ${POSTGRES_DB:-casillas_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Almacenamiento de Objetos S3-compatible: MinIO para PDFs y Acuses
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: casillas_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Web Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "echo > /dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auto-configurador de Buckets de MinIO (Crea el bucket oficial al iniciar)
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    container_name: casillas_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-casillas-notificaciones}
    entrypoint:
      - /bin/bash
      - -c
      - >
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          echo "Esperando que MinIO responda...";
          sleep 2;
        done;
        mc mb --ignore-existing local/"$${MINIO_BUCKET_NAME}";
        mc anonymous set download local/"$${MINIO_BUCKET_NAME}";
        echo "Bucket de Casillas MTC Puno inicializado con éxito.";
        exit 0;

  # Redis para broker de tareas de background, locks y cache de tokens MTC
  redis:
    image: redis:7-alpine
    container_name: casillas_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Backend API: FastAPI con recarga en caliente
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: casillas_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-casillas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casillas_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-casillas_db}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-casillas_user}:${POSTGRES_PASSWORD:-casillas_secret_pass}@postgres:5432/${POSTGRES_DB:-casillas_db}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-casillas-notificaciones}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MTC_BASE_URL: ${MTC_BASE_URL:-https://wscasilla.mtc.gob.pe/ms-notific/v2/servicios-publicos}
      MTC_CLIENT_ID: ${MTC_CLIENT_ID}
      MTC_CLIENT_SECRET: ${MTC_CLIENT_SECRET}
      MTC_DRTC_BASE_URL: ${MTC_DRTC_BASE_URL:-https://mtc.transportespuno.gob.pe/api/v2}
      MTC_DRTC_API_KEY: ${MTC_DRTC_API_KEY:-topSecret123}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Frontend: Angular 22 servido con Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: casillas_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: casillas_postgres_data
  minio_data:
    name: casillas_minio_data
  redis_data:
    name: casillas_redis_data
