services:
  # Base de Datos Relacional: PostgreSQL con soporte JSONB para respuestas MTC
  postgres:
    image: postgres:16-alpine
    container_name: casillas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-casillas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casillas_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-casillas_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casillas_user} -d ${POSTGRES_DB:-casillas_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Almacenamiento de Objetos S3-compatible: RustFS (High-Performance Distributed Object Storage en Rust)
  rustfs:
    image: rustfs/rustfs:latest
    container_name: casillas_rustfs
    restart: unless-stopped
    command: rustfs server --console-enable /data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin123}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_ADDRESS: ":9000"
    ports:
      - "${STORAGE_PORT:-9000}:9000"         # S3 API
      - "${STORAGE_CONSOLE_PORT:-9001}:9001" # Web Console UI
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para broker de tareas de background, locks y cache de tokens MTC
  redis:
    image: redis:7-alpine
    container_name: casillas_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Backend API: FastAPI con recarga en caliente
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: casillas_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-casillas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casillas_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-casillas_db}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-casillas_user}:${POSTGRES_PASSWORD:-casillas_secret_pass}@postgres:5432/${POSTGRES_DB:-casillas_db}
      STORAGE_TYPE: rustfs
      RUSTFS_ENDPOINT: rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin123}
      RUSTFS_BUCKET_NAME: ${RUSTFS_BUCKET_NAME:-casillas-notificaciones}
      MINIO_ENDPOINT: rustfs:9000
      MINIO_ROOT_USER: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      MINIO_ROOT_PASSWORD: ${RUSTFS_SECRET_KEY:-rustfsadmin123}
      MINIO_BUCKET_NAME: ${RUSTFS_BUCKET_NAME:-casillas-notificaciones}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MTC_BASE_URL: ${MTC_BASE_URL:-https://wscasilla.mtc.gob.pe/ms-notific/v2/servicios-publicos}
      MTC_CLIENT_ID: ${MTC_CLIENT_ID}
      MTC_CLIENT_SECRET: ${MTC_CLIENT_SECRET}
      MTC_DRTC_BASE_URL: ${MTC_DRTC_BASE_URL:-https://casillas.transportespuno.gob.pe/api/v2}
      MTC_DRTC_API_KEY: ${MTC_DRTC_API_KEY:-topSecret123}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  # Frontend: Angular 22 servido con Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: casillas_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: casillas_postgres_data
  rustfs_data:
    name: casillas_rustfs_data
  redis_data:
    name: casillas_redis_data
